[package]
name = "tauri-plugin-native-camera"
version = "0.1.0"
description = "A Tauri plugin to capture photos using the device's native camera app"
authors = ["Kushal Das <mail@kushaldas.in>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
repository = "https://github.com/kushaldas/tauri-plugin-native-camera"
documentation = "https://docs.rs/tauri-plugin-native-camera"
keywords = ["tauri", "plugin", "camera", "android", "mobile"]
categories = ["multimedia::images", "api-bindings"]
readme = "README.md"
links = "tauri-plugin-native-camera"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
